name: ImmortalWrt (純淨官方滾動主線)

on:
  workflow_dispatch: # 支援在 Actions 頁面手動觸發建置
  # push:
  #   branches:
  #     - main

jobs:
  build:
    name: 建置 ${{ matrix.target }} -${{ matrix.variant }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 允許腳本建立和寫入 Release
    strategy:
      fail-fast: false
      matrix:
        target: [jdcloud_re-cp-03, cudy_tr3000-v1, cmcc_rax3000m-emmc]
        variant: [5-plugins, 3-plugins] # 變體分類：5外掛版本 與 3外掛版本

    steps:
      - name: 檢出工作區程式碼 (Checkout Code)
        uses: actions/checkout@v3

      - name: 初始化編譯環境 (Initialize Environment)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          # 設定時區為台北時間
          sudo timedatectl set-timezone "Asia/Taipei"

      - name: 拉取 ImmortalWrt 官方最新主線原始碼 (Clone Master Branch)
        run: |
          # 預設拉取官方最前沿的 master 主線 (Rolling Release)
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          
          # 獲取官方原始碼最新更新時間 (格式：YYYYMMDD)
          UPSTREAM_DATE=$(git log -1 --format="%cd" --date=format:"%Y%m%d")
          echo "獲取到官方更新時間: $UPSTREAM_DATE"
          echo "UPSTREAM_DATE=$UPSTREAM_DATE" >> $GITHUB_ENV

      - name: 安裝外部擴充套件與更新來源 (Install Extra Plugins)
        working-directory: ./openwrt
        run: |
          # 1. 引入 Nikki 軟體來源
          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default
          
          # 2. 引入 rtp2httpd (官方手動整合模式)
          git clone --depth 1 https://github.com/stackia/rtp2httpd /tmp/rtp2httpd
          cp -r /tmp/rtp2httpd/openwrt-support/luci-app-rtp2httpd package/luci-app-rtp2httpd
          cp -r /tmp/rtp2httpd/openwrt-support/rtp2httpd package/rtp2httpd
          mv package/rtp2httpd/Makefile.versioned package/rtp2httpd/Makefile
          mv package/luci-app-rtp2httpd/Makefile.versioned package/luci-app-rtp2httpd/Makefile

          # 3. 更新並安裝所有官方 feeds 
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 4. 確保系統預設主題為 Argon
          sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile

      - name: 自動生成編譯設定 (Generate .config)
        working-directory: ./openwrt
        run: |
          rm -f .config
          touch .config
          
          # --- 目標設備 (Target) ---
          if [ "${{ matrix.target }}" == "jdcloud_re-cp-03" ]; then
            echo "CONFIG_TARGET_mediatek=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jdcloud_re-cp-03=y" >> .config
          elif [ "${{ matrix.target }}" == "cudy_tr3000-v1" ]; then
            echo "CONFIG_TARGET_mediatek=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1=y" >> .config
          elif [ "${{ matrix.target }}" == "cmcc_rax3000m-emmc" ]; then
            echo "CONFIG_TARGET_mediatek=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y" >> .config
          fi
          
          # --- 基礎外掛 (3-plugins 所有版本共有) ---
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ddns=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts_aliyun=y" >> .config
          echo "CONFIG_PACKAGE_ddns-scripts_cloudflare.com-v4=y" >> .config
          # SFTP 伺服端
          echo "CONFIG_PACKAGE_openssh-sftp-server=y" >> .config
          
          # 取消勾選預設 bootstrap 主題
          echo "# CONFIG_PACKAGE_luci-theme-bootstrap is not set" >> .config
          
          # --- 5個插件專屬 (5-plugins 版本額外追加) ---
          if [ "${{ matrix.variant }}" == "5-plugins" ]; then
            echo "CONFIG_PACKAGE_luci-app-nikki=y" >> .config
            echo "CONFIG_PACKAGE_luci-app-rtp2httpd=y" >> .config
            echo "CONFIG_PACKAGE_rtp2httpd=y" >> .config
          fi
          
          make defconfig

      - name: 下載編譯依賴套件 (Download Packages)
        working-directory: ./openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 編譯韌體 (Compile Firmware)
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: 整理韌體命名與版本號淨化 (Organize Files & Clean Version)
        id: organize
        run: |
          cd openwrt
          
          # 安全提取版本號：過濾掉動態變數，只精準提取數字版本號 (如 25.12) 
          RAW_VERSION=$(grep 'VERSION_NUMBER:=' include/version.mk || true)
          IMG_VERSION=$(echo "$RAW_VERSION" | grep -oE '[0-9]+\.[0-9]+[^ ,)]*' | head -n 1)
          
          # 若提取失敗，預設給予 SNAPSHOT 標識
          if [ -z "$IMG_VERSION" ]; then
            IMG_VERSION="SNAPSHOT"
          fi
          
          echo "解析到的安全版本號為: $IMG_VERSION"
          echo "IMG_VERSION=$IMG_VERSION" >> $GITHUB_ENV
          
          cd bin/targets/*/*
          rm -rf packages
          
          for file in *; do
            if [[ -f "$file" ]]; then
              ext="${file##*.}"
              filename="${file%.*}"
              mv "$file" "${filename}-v${IMG_VERSION}-${{ env.UPSTREAM_DATE }}-${{ matrix.variant }}.${ext}"
            fi
          done
          
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 產生發布說明文件 (Generate Release Notes)
        run: |
          echo "## 🚀 ImmortalWrt 官方韌體自動編譯發布" > release_notes.md
          echo "- **目標設備**: \`${{ matrix.target }}\`" >> release_notes.md
          echo "- **底層版本**: \`v${{ env.IMG_VERSION }}\` (官方最新主線)" >> release_notes.md
          echo "- **編譯時間**: \`${{ env.UPSTREAM_DATE }}\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 預裝外掛與組件清單" >> release_notes.md
          echo "本韌體預設已整合 **Argon 主題 (luci-theme-argon)** 與 **SFTP 伺服端 (openssh-sftp-server)**。" >> release_notes.md
          echo "" >> release_notes.md
          
          if [ "${{ matrix.variant }}" == "3-plugins" ]; then
            echo "#### 🟢 基礎精簡版 (3-plugins)" >> release_notes.md
            echo "包含以下核心外掛，適合追求極致穩定的使用者：" >> release_notes.md
            echo "1. **TTYD 終端機** (\`luci-app-ttyd\`)" >> release_notes.md
            echo "2. **DDNS 動態域名** (包含阿里雲、Cloudflare 支援腳本)" >> release_notes.md
          elif [ "${{ matrix.variant }}" == "5-plugins" ]; then
            echo "#### 🔴 全功能高階版 (5-plugins)" >> release_notes.md
            echo "在基礎版之上，額外新增以下進階網路外掛：" >> release_notes.md
            echo "1. **TTYD 終端機** (\`luci-app-ttyd\`)" >> release_notes.md
            echo "2. **DDNS 動態域名** (包含阿里雲、Cloudflare 支援腳本)" >> release_notes.md
            echo "3. **Nikki 代理** (\`luci-app-nikki\`，完美適配官方 nftables/firewall4 架構)" >> release_notes.md
            echo "4. **RTP2HTTPD** (IPTV 組播轉 HTTP 轉發，採用官方手動整合模式)" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "> 💡 *此頁面與韌體由 GitHub Actions 依據配置全自動化建置。*" >> release_notes.md

      - name: 發布至 Releases (Upload Firmware to Release)
        uses: softprops/action-gh-release@v1
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ matrix.target }}-v${{ env.IMG_VERSION }}-${{ env.UPSTREAM_DATE }}-${{ matrix.variant }}-Build-${{ github.run_number }}
          name: 韌體下載: ${{ matrix.target }} - v${{ env.IMG_VERSION }} (${{ matrix.variant }})
          body_path: release_notes.md
          files: ${{ env.FIRMWARE }}/*
