          | 機型名稱 | 韌體目標代號 | 處理器與儲存配置 | 適配引導環境 |
          | :--- | :--- | :--- | :--- |
          | **Cudy TR3000 v1** | \`cudy_tr3000-v1\` | MediaTek MT7981B · 128MB SPI-NAND（112MB 大分區） | ${BOOT_ENV_NAND} |
          | **京東雲無線寶 AX6000 百里** | \`jdcloud_re-cp-03\` | MediaTek MT7986A · eMMC 高速儲存 | ${BOOT_ENV_EMMC} |
          | **中國移動 RAX3000M 算力版** | \`cmcc_rax3000m-emmc\` | MediaTek MT7981B · eMMC 高速儲存 | ${BOOT_ENV_EMMC} |

          ### 檔案校驗 (SHA-256)

