      - name: 發布至 GitHub Releases (Create Unified Release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep_release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "ImmortalWrt ${{ steps.prep_release.outputs.detected_ver }} (${{ steps.prep_release.outputs.img_fmt_upper }}) · ${{ steps.prep_release.outputs.release_tag }}"
          body_path: release_notes.md
          files: |
            all_firmwares/*.${{ needs.prepare.outputs.img_fmt }}
            all_firmwares/sha256sums.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false
          fail_on_unmatched_files: true